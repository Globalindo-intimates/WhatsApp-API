<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
        .glow-on-hover {
            width: 220px;
            height: 50px;
            border: none;
            outline: none;
            color: #fff;
            background: #111;
            cursor: pointer;
            position: relative;
            z-index: 0;
            border-radius: 10px;
        }

        .glow-on-hover:before {
            content: '';
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            position: absolute;
            top: -2px;
            left:-2px;
            background-size: 400%;
            z-index: -1;
            filter: blur(5px);
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            animation: glowing 20s linear infinite;
            opacity: 0;
            transition: opacity .3s ease-in-out;
            border-radius: 10px;
        }

        .glow-on-hover:active {
            color: #000
        }

        .glow-on-hover:active:after {
            background: transparent;
        }

        .glow-on-hover:hover:before {
            opacity: 1;
        }

        .glow-on-hover:after {
            z-index: -1;
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #111;
            left: 0;
            top: 0;
            border-radius: 10px;
        }

        @keyframes glowing {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }    
    </style>
</head>
<body>
    <div class="container" style="background-image: url(img/6397022.jpg); min-height: 100vh;
    min-width: 100vw; background-size: cover">
        <div id="app" class="row justify-content-center">
            <h1 class="text-center text-white">WhatsApp API PT. Globalindo Intimates</h1>

            <form method="post" id="cityform"></form>
                <div class="row">
                    <div class="col-4 text-center justify-content-center align-items-center d-flex">
                            <button class="glow-on-hover" id="submitBtn" type="submit">Ping Server!</button>
                    </div>
                    <div class="col-4">
                        <img src="img/98993-three-dots-loading.gif" style="max-width:300px; border-radius: 50%;" alt="QR Code" id="qrcode" class="mt-3">
                    </div>
                    <div class="col-4"></div>
                </div>
            </form>
            
            <div style="background-color: rgba(255, 255, 255, 0.2); padding: 10px;" class="mt-3">
                <h3 class="text-white">Logs:</h3>
                <ul class="logs text-white" style="overflow: auto; height: 300px;"></ul>
            </div>
            
        </div>
    </div> 
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.6.4.js" integrity="sha256-a9jBBRygX1Bh5lt8GZjXDzyOB+bWve9EiO7tROUtj/E=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.js" integrity="sha512-xbQU0+iHqhVt7VIXi6vBJKPh3IQBF5B84sSHdjKiSccyX/1ZI7Vnkt2/8y8uruj63/DVmCxfUNohPNruthTEQA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
    $(document).ready(function(){
        var socket = io('http://localhost:8000');

        socket.on("connect", () => {
            $('.logs').append(`<li>Socket Connected</li>`);
            socket.emit('check_status');
        });

        socket.on('message', function(msg){
            $('.logs').append(`<li>${msg}</li>`);
        });

        socket.on('qr', function(src){
            $('#qrcode').attr('src', src);
        });

        socket.on('ready',function(ready){
            $('#qrcode').attr('src','img/' +ready);
        });

        $("#submitBtn").on('click', function(e) {
            try{
                $.ajax({
                    url: "http://localhost:8000/send-message",
                    type: "POST",
                    data: {
                        'number': '085802520642',
                        'message': 'AdrianAPI',
                    },
                    success: function(data){
                        alert('WhatsApp Sended to Adrian')
                    },
                    error: function (request, status, error) {
                        alert(JSON.parse(request.responseText).message.message);
                    }
                });
            } catch (err){
                alert(err.message)
            } 
            
        });
    });
</script>
</html>
